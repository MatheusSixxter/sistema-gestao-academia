<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sistema de Academia{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>



    <style>
        :root {
            --sidebar-bg: #211A2B;
            --sidebar-border: #493568;
            --sidebar-link: #C4B5FD;
            --sidebar-hover: #352747;
            --sidebar-active: #493568;

            --content-bg: #0D1019;
            --card-bg: #30283A;
            --input-bg: #352D40;
            --input-border: #554665;

            --text-primary: #F3EFFA;
            --text-muted: #B0A5BE;

            --primary-purple: #6F42C1;
        }

        /* Configuração geral */
        html,
        body {
            min-height: 100%;
            background-color: var(--content-bg);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
        }

        /* Layout principal */
        .layout-row {
            flex: 1;
            min-height: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            flex: 0 0 250px;
            min-height: calc(100vh - 120px);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
        }

        .sidebar-inner {
            position: sticky;
            top: 0;
            padding: 1rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--sidebar-link);
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .sidebar .nav-link i {
            font-size: 1.15rem;
            min-width: 22px;
            text-align: center;
        }

        .sidebar .nav-link:hover {
            background-color: var(--sidebar-hover);
            color: #FFFFFF;
        }

        .sidebar .nav-link.active {
            background-color: var(--sidebar-active);
            color: #FFFFFF;
        }

        .sidebar-divider {
            border-color: var(--sidebar-border);
            opacity: 1;
            margin: 1rem 0;
        }

        /* Cabeçalho */
        .main-header {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--sidebar-border);
        }

        .main-header .navbar-brand {
            color: #FFFFFF;
            font-weight: 600;
        }

        .main-header .navbar-brand:hover {
            color: var(--sidebar-link);
        }

        /* Conteúdo */
        .main-content {
            background-color: var(--content-bg);
            flex: 1;
            min-width: 0;
        }

        /* Cards e painéis */
        .card {
            background-color: var(--card-bg);
            border-color: var(--sidebar-border);
            color: var(--text-primary);
        }

        .card.bg-dark {
            background-color: var(--card-bg) !important;
            border-color: var(--sidebar-border) !important;
        }

        /* Formulários e campos de busca */
        .form-control,
        .form-select,
        .input-group-text {
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: var(--input-bg);
            border-color: #9B7BD3;
            color: #FFFFFF;
            box-shadow: 0 0 0 0.2rem rgba(155, 123, 211, 0.2);
        }

        .form-control:focus::placeholder {
            color: var(--text-muted);
        }

        .form-select option {
            background-color: var(--card-bg);
            color: #FFFFFF;
        }

        /* Tabelas */
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: var(--text-primary);
            --bs-table-hover-bg: #3A3046;
            --bs-table-hover-color: #FFFFFF;
            --bs-table-border-color: #493F55;
        }

        /* Links */
        a {
            transition: color 0.2s ease;
        }

        /* Rodapé */
        .main-footer {
            background-color: var(--content-bg);
            border-top: 1px solid rgba(196, 181, 253, 0.12);
        }

        /* Responsividade */
        @media (max-width: 575.98px) {
            .layout-row {
                flex-wrap: wrap !important;
            }

            .sidebar {
                width: 100%;
                flex: 0 0 100%;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid var(--sidebar-border);
            }

            .sidebar-inner {
                position: static;
            }

            .main-content {
                width: 100%;
            }
        }

        /* Botão roxo principal */
            .btn-purple {
                background-color: #6F42C1;
                border-color: #6F42C1;
                color: #fff;
            }

            .btn-purple:hover {
                background-color: #59359C;
                border-color: #59359C;
                color: #fff;
            }

            .btn-purple:focus-visible {
                box-shadow: 0 0 0 .2rem rgba(111, 66, 193, .4);
            }

    </style>
</head>

<body>

    {% include 'components/_header.html' %}

    <div class="container-fluid px-0">
        <div class="row g-0 flex-nowrap layout-row">

            {% include 'components/_sidebar.html' %}

            <div class="col main-content py-3">
                <div class="container-fluid px-3 px-lg-4 mt-3">

                    <main>
                        {% block content %}
                        {% endblock %}
                    </main>

                </div>
            </div>

        </div>
    </div>

    {% include 'components/_footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3bHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>

</body>
</html>
